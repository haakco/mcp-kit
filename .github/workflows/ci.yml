name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select suites from the changed paths
        id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; selecting the Go suite." >&2
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if [ -z "$changed" ]; then
            echo "No changed files reported; selecting the Go suite." >&2
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown-only and plan-only changes must not run Go or conformance.
          if ! printf '%s\n' "$changed" | grep -vE '\.(md)$' | grep -q .; then
            echo "Documentation-only change; skipping the Go and conformance suites."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Quality gate
        run: just quality
      - name: Vulnerability check
        run: just vulncheck

  conformance:
    name: Conformance (MCP 2026-07-28)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conformance gate
        run: ./scripts/conformance/run.sh --results conformance-results
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-results
          if-no-files-found: ignore
          retention-days: 7
